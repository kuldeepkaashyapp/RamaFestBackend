services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${IMAGE_NAME:-ghcr.io/kuldeepkaashyapp/ramafest}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      API_URL: ${API_URL}
      PORT: 8000
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      APP_AUDIT_TRUSTED_PROXIES: ${APP_AUDIT_TRUSTED_PROXIES:-}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-none}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-false}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30s}
    volumes:
      - uploads:/app/uploads

volumes:
  postgres-data:
  uploads:
