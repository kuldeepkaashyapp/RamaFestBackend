spring.application.name=RamaFest

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ramafest_db}
spring.datasource.username=${DB_USERNAME:rama_festdev}
spring.datasource.password=${DB_PASSWORD:dev@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Frontend origin
spring.frontend.url=${FRONTEND_URL:http://localhost:5173}
spring.allowed-origins=${ALLOWED_ORIGINS:https://www.ramafest.in,https://rama-sports-fest.vercel.app}
spring.api.url=${API_URL:http://localhost:8981}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

server.port=${PORT:8981}

# Comma-separated CIDR ranges for proxies allowed to provide client-IP headers.
# Override with APP_AUDIT_TRUSTED_PROXIES in deployments using a reverse proxy.
app.audit.trusted-proxies=${APP_AUDIT_TRUSTED_PROXIES:127.0.0.1/32,::1/128}

server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:none}
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/
