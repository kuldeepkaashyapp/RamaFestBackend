spring.application.name=RamaFest

# Required production environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Never modify the production schema automatically.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}
logging.level.root=INFO

# Frontend/API configuration
spring.frontend.url=${FRONTEND_URL}
spring.allowed-origins=${ALLOWED_ORIGINS:${FRONTEND_URL}}
spring.api.url=${API_URL}

# Audit logging and reverse proxy trust
app.audit.trusted-proxies=${APP_AUDIT_TRUSTED_PROXIES:}

# Secure session cookie settings for HTTPS deployments
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:none}
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/

# Keep API documentation disabled unless explicitly enabled.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

# Operational health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Application-managed upload location (kept configurable for deployments)
app.upload-dir=${UPLOAD_DIR:uploads}
